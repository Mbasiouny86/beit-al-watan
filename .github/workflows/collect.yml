name: Collect plot data

on:
  schedule:
    # Times are UTC. Jeddah/Cairo = UTC+3.
    # Every hour from 11:17 to 21:17 Jeddah, Sunday–Thursday.
    - cron: '17 8-18 * * 0-4'
  workflow_dispatch:
    inputs:
      summary:
        description: 'Send the daily Telegram summary now (1 = yes)'
        required: false
        default: ''

permissions:
  contents: write

concurrency:
  group: collect
  cancel-in-progress: false

env:
  TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
  TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
  PAGE_URL: https://${{ github.repository_owner }}.github.io/${{ github.event.repository.name }}/

jobs:
  # Madinty: runs on GitHub's servers (Madinty accepts them).
  madinty:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install --no-audit --no-fund
      - name: Collect Madinty
        env:
          ONLY: madinty
        run: node collect.mjs
      - name: Save data
        if: always()
        run: |
          git config user.name "plot-collector"
          git config user.email "plot-collector@users.noreply.github.com"
          git add data
          git diff --cached --quiet && exit 0
          git commit -m "madinty $(TZ=Asia/Riyadh date +%Y-%m-%dT%H:%M)"
          for i in 1 2 3 4; do git pull --rebase -X theirs origin main && git push origin HEAD:main && exit 0; sleep $((i*5)); done
          exit 1

  # NUCA blocks foreign/data-centre addresses, so this job runs on Mohamed's Mac
  # (self-hosted runner). If the Mac is off it waits; only the newest run is kept.
  nuca:
    needs: madinty
    if: always()
    runs-on: self-hosted
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install --no-audit --no-fund
      - name: Collect NUCA
        env:
          ONLY: nuca
          SUMMARY: ${{ github.event.inputs.summary }}
        run: node collect.mjs
      - name: Save data
        if: always()
        run: |
          git config user.name "plot-collector"
          git config user.email "plot-collector@users.noreply.github.com"
          git add data
          git diff --cached --quiet && exit 0
          git commit -m "nuca $(TZ=Asia/Riyadh date +%Y-%m-%dT%H:%M)"
          for i in 1 2 3 4; do git pull --rebase -X theirs origin main && git push origin HEAD:main && exit 0; sleep $((i*5)); done
          exit 1
