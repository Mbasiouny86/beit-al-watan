name: Collect plot data

on:
  schedule:
    # Times are UTC. Jeddah/Cairo = UTC+3.
    # Every hour from 11:17 to 21:17 Jeddah, Sunday–Thursday.
    - cron: '17 8-18 * * 0-4'
  workflow_dispatch:
    inputs:
      only:
        description: 'Run only one source (madinty or nuca), or leave empty for both'
        required: false
        default: ''
      summary:
        description: 'Send the daily Telegram summary now (1 = yes)'
        required: false
        default: ''

permissions:
  contents: write

concurrency:
  group: collect
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install --no-audit --no-fund
      - name: Collect
        env:
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          PAGE_URL: https://${{ github.repository_owner }}.github.io/${{ github.event.repository.name }}/
          ONLY: ${{ github.event.inputs.only }}
          SUMMARY: ${{ github.event.inputs.summary }}
        run: node collect.mjs
      - name: Save data
        if: always()
        run: |
          git config user.name "plot-collector"
          git config user.email "plot-collector@users.noreply.github.com"
          git add data
          git diff --cached --quiet || (git commit -m "data $(TZ=Asia/Riyadh date +%Y-%m-%dT%H:%M)" && git push)
