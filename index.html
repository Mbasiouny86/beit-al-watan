const PEND=new Set();let LASTERR=0;
const TOMB=()=>{try{return new Set(JSON.parse(localStorage.getItem('bw_sl_del')||'[]'))}catch(e){return new Set}};function tomb(id,on){try{const t=TOMB();on?t.add(id):t.delete(id);localStorage.setItem('bw_sl_del',JSON.stringify([...t]))}catch(e){}}
async function persist(it,del){saveLocal();tomb(it.id,!!del);if(!db)return;if(del)PEND.add(it.id);for(let k=0;k<2;k++){try{const ref=db.collection('shortlist2').doc(docId(it.id));if(del)await ref.delete();else await ref.set(it);if(del){tomb(it.id,false);setTimeout(()=>PEND.delete(it.id),4000)}return true}catch(e){if(e&&e.code==='unavailable'&&k===0){await new Promise(r=>setTimeout(r,600+Math.random()*600));continue}if(Date.now()-LASTERR>5000){LASTERR=Date.now();toast(L2('Could not save to your online list','تعذر الحفظ في قائمتك على الإنترنت')+' ('+(e&&e.code||e)+')')}if(del)PEND.delete(it.id);return false}}}

function alternatives(s,k=3){const ex=x=>(x.c?1:0)+(x.g?2:0)+(x.s?4:0);const want=ex({c:s.cx,g:s.gx,s:s.sx});const taken=new Set(shortlist.map(x=>x.id));

  const score=(z,p,zb)=>Math.abs(p.a-s.a)/Math.max(1,s.a)*100+(ex(p)===want?0:(ex(p)&want?8:20))+Math.abs(p.p-s.p)/Math.max(1,s.p)*50+zb+(p.d&&p.d===s.d?0:3);

  db.collection('shortlist2').onSnapshot(s=>{const T=TOMB();s.docs.forEach(x=>{const v=x.data();if(v&&T.has(v.id)&&!PEND.has(v.id)){PEND.add(v.id);persist(v,true)}});const d=s.docs.map(x=>x.data()).filter(x=>x&&!PEND.has(x.id)&&!T.has(x.id));if(d.length||!shortlist.length){shortlist=d;saveLocal();if(tab==='mine'||tab==='plots')render()}});
})();
})();
</script>
