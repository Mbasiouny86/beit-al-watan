function drawMap(el,box,W,H,cities,geo,skip){
  const [la0,la1,lo0,lo1]=box,P=14,X=lo=>P+(lo-lo0)/(lo1-lo0)*(W-2*P),Y=la=>P+(la1-la)/(la1-la0)*(H-2*P);
  const path=pts=>pts.map((p,i)=>(i?'L':'M')+X(p[1]).toFixed(1)+','+Y(p[0]).toFixed(1)).join('');
  let s=geo.map(g=>`<path class="${g.cls}" d="${path(g.pts)}"/>`).join('');
  if(skip){const[a0,a1,b0,b1]=skip;s+=`<rect x="${X(b0)}" y="${Y(a1)}" width="${X(b1)-X(b0)}" height="${Y(a0)-Y(a1)}" fill="none" stroke="var(--muted)" stroke-dasharray="3 3" rx="4"/>`}
  const boxes=[],hit=b=>b.x<2||b.x+b.w>W-2||b.y<2||b.y+b.h>H-2||boxes.some(o=>b.x<o.x+o.w&&b.x+b.w>o.x&&b.y<o.y+o.h&&b.y+b.h>o.y);
  const max=Math.max(1,...cities.map(c=>c.n));
  const pts=cities.filter(c=>{const g=GEO[NORM(c.c)];return g&&g[0]>=la0&&g[0]<=la1&&g[1]>=lo0&&g[1]<=lo1}).sort((a,b)=>b.n-a.n).map(c=>{const[la,lo]=GEO[NORM(c.c)];const inSkip=!!skip&&la>=skip[0]&&la<=skip[1]&&lo>=skip[2]&&lo<=skip[3];const r=inSkip?3:(c.n===0?4:4+11*Math.sqrt(c.n/max));const x=X(lo),y=Y(la);boxes.push({x:x-r,y:y-r,w:2*r,h:2*r});return{c,x,y,r,inSkip}});
  let dots='',txt='';
  pts.forEach(({c,x,y,r,inSkip})=>{dots+=`<g class="dot" data-city="${esc(c.c)}"><title>${esc(cname(c.c))}: ${c.n}</title><circle cx="${x}" cy="${y}" r="${r}" fill="${dotColor(c.n)}" fill-opacity=".8"/></g>`;if(inSkip)return;
    const nm=cname(c.c),num=fmt(c.n),w=Math.max(nm.length*6.3,num.length*7)+4,hh=26;

  el.innerHTML=s+dots+txt;
}

  const tiles=[['summary','summary',T[LANG].tabs.summary],['booked','bookedT',T[LANG].tabs.booked],['cities','cities',T[LANG].tabs.cities],['plots','plots',T[LANG].tabs.plots],
    ['mine','mine',[T[LANG].tabs.mine[0],shortlist.length?`${shortlist.length} ★${nGone?' · '+nGone+' '+t('m_gone'):''}${wAlert?' · '+wAlert+' ⚠':''}`:T[LANG].tabs.mine[1]]],['maps','maps',[t('h_maps'),t('h_maps_d')]]];
  $('home').innerHTML=`<div class="minis">${mini.map(([ic,l,v,d])=>`<div class="mini"><span class="ic">${svg(ic)}</span><span class="t">${esc(l)}</span><span class="v">${v}</span>${d?`<span class="d">${esc(d)}</span>`:''}</div>`).join('')}</div>
  ${(nGone||wAlert)?`<p class="note warn">⚠ ${nGone?`${nGone} ${LANG==='ar'?'من اختياراتك تم حجزها':'of your picks were booked'}`:''}${nGone&&wAlert?' · ':''}${wAlert?`${wAlert} ${LANG==='ar'?'منطقة متابعة عليها تنبيه':'watched zone alert(s)'}`:''}</p>`:''}
  <div class="tiles">${tiles.map(([k,ic,[l,h]])=>`<button class="tile" data-tab="${k}"><span class="ic">${svg(ic)}</span><b>${esc(l)}</b><small>${esc(h)}</small></button>`).join('')}
  <button class="tile" data-refresh="1"><span class="ic">${svg('refresh')}</span><b>${t('h_refresh')}</b><small>${t('h_refresh_d')}</small></button></div>`;
}

// ---------- NUCA plans ----------
let MAPS={z:{},p:{}},mapCity=null,osd=null;
const nucaZones=c=>(cur()?.zones||[]).filter(z=>NORM(z.c)===NORM(c));
const TOKS=s=>NORM(String(s||'').replace(/[()\-–_.]/g,' ')).length?String(s||'').replace(/[أإآ]/g,'ا').replace(/ة/g,'ه').replace(/ى/g,'ي').replace(/[()\-–_.,]/g,' ').split(/\s+/).filter(w=>w&&!/^(ال)?(حي|حى|منطقه|منطقة|المنطقه|مجاوره|المجاوره|بجوار|بالقرب|من|و|بال|الحي|الحى|رقم)$/.test(w)):[];
function bestNuca(c,z,d){const list=nucaZones(c).filter(x=>MAPS.z[x.zid]);if(!list.length)return null;const want=new Set(TOKS(z+' '+(d||'')).map(NORM));const wantD=new Set(TOKS(d||'').map(NORM));
  let best=null,bs=-1;for(const x of list){const have=TOKS(x.p+' '+x.r).map(NORM);let sc=0;have.forEach(w=>{if(want.has(w))sc+=(/[a-z0-9]/i.test(w)?3:1)+(wantD.has(w)?2:0)});if(sc>bs||(sc===bs&&x.n>(best?.n||0))){bs=sc;best=x}}return best}
function openPlan(c,z,d){const b=bestNuca(c,z,d);if(!b){toast(t('mp_none'));return}openPlanZid(b.zid,c)}
function loadOSD(){return window.OpenSeadragon?Promise.resolve():new Promise((ok,no)=>{const s=document.createElement('script');s.src='https://cdnjs.cloudflare.com/ajax/libs/openseadragon/4.1.0/openseadragon.min.js';s.onload=ok;s.onerror=no;document.head.appendChild(s)})}
async function openPlanZid(zid,c){const z=(cur()?.zones||[]).find(x=>x.zid===zid);c=c||z?.c;const m=MAPS.z[zid];const dlg=$('planDlg');
  const opts=nucaZones(c).filter(x=>MAPS.z[x.zid]);
  dlg.innerHTML=`<div class="dlghead"><label>${t('mp_pick')} <select id="planSel">${opts.map(x=>`<option value="${x.zid}" ${x.zid===zid?'selected':''}>${esc(x.p)}${x.r&&x.r!==x.p?' · '+esc(x.r):''} (${fmt(x.n)} ${t('mp_free')})</option>`).join('')}</select></label>
    <a class="btn" href="https://lands.nuca.gov.eg/ar/ViewZone.aspx?ID=${zid}" target="_blank" rel="noopener">${t('mp_nuca')}</a><button class="btn primary" id="planClose">${t('mp_close')}</button></div>
    <div id="osd"><p class="muted" style="padding:16px">${t('mp_loading')}</p></div>
    ${MAPS.p[z?.pid]?.img?`<details><summary class="small">${t('mp_project')}</summary><img class="projimg" loading="lazy" src="${esc(MAPS.p[z.pid].img)}" alt=""></details>`:''}`;
  if(!dlg.open)dlg.showModal();
  if(!m||!m.dzi){$('osd').innerHTML=`<p class="muted" style="padding:16px">${t('mp_none')}</p>`;return}
  try{await loadOSD();$('osd').innerHTML='';if(osd){try{osd.destroy()}catch(_){}}
    osd=OpenSeadragon({element:$('osd'),prefixUrl:'https://cdnjs.cloudflare.com/ajax/libs/openseadragon/4.1.0/images/',showNavigator:true,navigatorPosition:'BOTTOM_RIGHT',maxZoomPixelRatio:3,gestureSettingsTouch:{pinchRotate:false},
      tileSources:{Image:{xmlns:'http://schemas.microsoft.com/deepzoom/2008',Url:m.dzi,Format:m.f||'jpg',Overlap:String(m.ov??1),TileSize:String(m.ts||256),Size:{Width:String(m.w),Height:String(m.h)}}}})}
  catch(e){$('osd').innerHTML=m.icon?`<img class="projimg" src="${esc(m.icon)}" alt="">`:`<p class="muted" style="padding:16px">${t('mp_none')}</p>`}}
function closePlan(){const d=$('planDlg');if(osd){try{osd.destroy()}catch(_){}osd=null}if(d.open)d.close()}
document.addEventListener('change',e=>{if(e.target.id==='planSel')openPlanZid(+e.target.value)});
function thumbOf(m){if(!m)return'';if(m.icon)return m.icon;if(!m.dzi)return'';const max=Math.ceil(Math.log2(Math.max(m.w,m.h)));return m.dzi+Math.max(0,Math.min(max,8))+'/0_0.'+(m.f||'jpg')}
function renderMaps(){
  const cs=cityStats().filter(c=>nucaZones(c.c).length).sort((a,b)=>(b.av??0)-(a.av??0));
  if(!mapCity||!cs.find(c=>NORM(c.c)===NORM(mapCity)))mapCity=(selCity&&cs.find(c=>NORM(c.c)===NORM(selCity))?.c)||cs[0]?.c;
  const zs=mapCity?nucaZones(mapCity).slice().sort((a,b)=>b.n-a.n):[];
  $('p-maps').innerHTML=`<section><div class="sh"><div><h2>${t('mp_title')}</h2><p class="muted small">${t('mp_desc')}</p></div></div>
  <div class="chips">${cs.map(c=>`<button class="chip" aria-pressed="${NORM(c.c)===NORM(mapCity)}" data-mapcity="${esc(c.c)}">${esc(cname(c.c))} <span class="num">${fmt(c.av)}</span></button>`).join('')}</div>
  <div class="mapgrid">${zs.map(z=>{const m=MAPS.z[z.zid];const th=thumbOf(m);return`<button class="mapcard" data-planz="${z.zid}">${th?`<img loading="lazy" src="${esc(th)}" alt="">`:`<span class="noimg">🗺</span>`}<b>${esc(z.p)}</b>${z.r&&z.r!==z.p?`<small>${esc(z.r)}</small>`:''}<span class="small"><span class="num">${fmt(z.n)}</span> ${t('mp_free')}</span></button>`}).join('')||`<p class="muted">${t('mp_none')}</p>`}</div></section>`;
}

// ---------- sync between devices (GitHub file config/mine.json) ----------
const GHAPI='https://api.github.com/repos/Mbasiouny86/beit-al-watan/contents/config/mine.json';
let ghTok='';try{ghTok=localStorage.getItem('bw_gh_tok')||''}catch(e){}
let sy={state:'idle',sha:null,at:null,err:null},localDirty=false;try{localDirty=localStorage.getItem('bw_dirty')==='1'}catch(e){}
const b64=s=>btoa(unescape(encodeURIComponent(s))),unb64=s=>decodeURIComponent(escape(atob(String(s).replace(/\s/g,''))));
async function pullMine(){const h={Accept:'application/vnd.github+json'};if(ghTok)h.Authorization='Bearer '+ghTok;
  const r=await fetch(GHAPI+'?ref=main',{headers:h,cache:'no-store'});if(r.status===404){sy.sha=null;return{shortlist:[],watch:[]}}if(!r.ok)throw new Error('HTTP '+r.status);
  const j=await r.json();sy.sha=j.sha;return JSON.parse(unb64(j.content))}
function mergeLists(R){const ids=new Set((R.shortlist||[]).map(x=>x.id));const sl=(R.shortlist||[]).concat(shortlist.filter(x=>!ids.has(x.id)));sl.forEach((x,i)=>x.rank=i+1);
  const wids=new Set((R.watch||[]).map(x=>x.id));return{shortlist:sl,watch:(R.watch||[]).concat(watch.filter(x=>!wids.has(x.id)))}}
async function pullAndApply(){try{const R=await pullMine();if(localDirty&&ghTok){const M=mergeLists(R);shortlist=M.shortlist;watch=M.watch;saveLocal();saveW();await pushMine()}
  else if(localDirty){const M=mergeLists(R);shortlist=M.shortlist;watch=M.watch;saveLocal();saveW()}
  else{shortlist=R.shortlist||[];watch=R.watch||[];saveLocal();saveW()}sy.state=sy.state==='err'?'idle':sy.state;sy.err=null;render()}catch(e){sy.state='err';sy.err=String(e.message||e)}}
let _pt;function scheduleSync(){localDirty=true;try{localStorage.setItem('bw_dirty','1')}catch(e){}if(!ghTok){toast(t('sy_local'));return}clearTimeout(_pt);_pt=setTimeout(()=>pushMine(),1200)}
async function pushMine(retry){if(!ghTok)return;sy.state='saving';renderSyncState();
  try{if(sy.sha==null){try{const R=await pullMine();if(!retry){const M=mergeLists(R);shortlist=M.shortlist;watch=M.watch}}catch(_){}}
    const body={message:'Update my list',branch:'main',content:b64(JSON.stringify({shortlist,watch,updated:new Date().toISOString()},null,1))};if(sy.sha)body.sha=sy.sha;
    const r=await fetch(GHAPI,{method:'PUT',headers:{Authorization:'Bearer '+ghTok,Accept:'application/vnd.github+json','Content-Type':'application/json'},body:JSON.stringify(body)});
    if((r.status===409||r.status===422)&&!retry){sy.sha=null;const R=await pullMine();const M=mergeLists(R);shortlist=M.shortlist;watch=M.watch;return pushMine(true)}
    if(!r.ok)throw new Error('HTTP '+r.status);const j=await r.json();sy.sha=j.content?.sha||null;localDirty=false;try{localStorage.removeItem('bw_dirty')}catch(e){}
    sy.state='ok';sy.at=new Date();sy.err=null}catch(e){sy.state='err';sy.err=String(e.message||e)}
  saveLocal();saveW();renderSyncState()}
function syncBox(){const on=!!ghTok;const st=sy.state==='saving'?t('sy_saving'):sy.state==='err'?t('sy_err')+(sy.err?' ('+esc(sy.err)+')':''):sy.at?t('sy_ok')+' '+sy.at.toLocaleTimeString(LANG==='ar'?'ar-EG-u-nu-latn':'en-GB',{hour:'2-digit',minute:'2-digit'}):'';
  return`<section class="box sync ${on?'on':''}"><div class="sh"><h3>🔄 ${t('sy_title')}</h3><span class="small" id="syState">${st}</span></div>
  <p class="small">${on?t('sy_on'):t('sy_off')}</p>
  ${on?`<div><button class="btn" id="syDisc">${t('sy_disc')}</button></div>`:`<details${localDirty?' open':''}><summary class="btn">${t('sy_connect')}</summary><div class="syform"><label>${t('sy_tok')} <input id="syTok" type="password" autocomplete="off" spellcheck="false"></label><button class="btn primary" id="syConnect">${t('sy_save')}</button>
  <a class="small" href="https://github.com/settings/personal-access-tokens/new" target="_blank" rel="noopener">${t('sy_help')} ↗</a></div></details>`}</section>`}
function renderSyncState(){const e=$('syState');if(!e)return;e.textContent=sy.state==='saving'?t('sy_saving'):sy.state==='err'?t('sy_err'):sy.at?t('sy_ok')+' '+sy.at.toLocaleTimeString(LANG==='ar'?'ar-EG-u-nu-latn':'en-GB',{hour:'2-digit',minute:'2-digit'}):''}
async function connectSync(){const v=($('syTok')?.value||'').trim();if(!v)return;
  const vv=v.replace(/\s+/g,'');
  try{const r=await fetch(GHAPI+'?ref=main',{headers:{Authorization:'Bearer '+vv,Accept:'application/vnd.github+json'},cache:'no-store'});if(!(r.ok||r.status===404))throw new Error('HTTP '+r.status)}
  catch(e){toast(t('sy_bad')+' ('+(e.message||e)+')');return}
  const v2=vv;
  ghTok=v2;try{localStorage.setItem('bw_gh_tok',v2)}catch(e){}localDirty=true;await pullAndApply();if(localDirty)await pushMine();toast(sy.state==='err'?t('sy_err')+' ('+sy.err+')':t('sy_done'));render()}
// ---------- boot ----------
try{const S=JSON.parse($('seed').textContent);snaps=S.snapshots||[];mad=S.madinty||null;research=S.research||null;MP=parsePlots(S.mplots||[])}catch(e){}
shortlist=loadLocal();try{watch=JSON.parse(localStorage.getItem('bw_watch')||'[]')}catch(e){watch=[]}
try{if(!localStorage.getItem('bw_sync_init')){if(shortlist.length||watch.length){localDirty=true;localStorage.setItem('bw_dirty','1')}localStorage.setItem('bw_sync_init','1')}}catch(e){}
try{const k=location.hash.slice(1);tab=TABS.includes(k)?k:(localStorage.getItem('bw_tab2')||'summary');if(TABS.includes(k))VIEW=k}catch(e){}
render();
async function loadData(){try{const q='?t='+Date.now(),f=n=>fetch('data/'+n+'.json'+q,{cache:'no-store'}).then(r=>r.ok?r.json():null).catch(()=>null);
  const [s,m,p,mp]=await Promise.all([f('snapshots'),f('madinty'),f('mplots'),f('maps')]);if(mp&&mp.z)MAPS=mp;
  if(Array.isArray(s)&&s.length)snaps=s.filter(x=>x&&x.zones);
  if(m&&m.zones&&(!live?.at||(m.ts||'')>(mad?.ts||''))){mad=m;if(Array.isArray(p)&&p.length)MP=parsePlots(p)}
  estServed();render()}catch(e){}}
(async()=>{
  await loadData();liveInit();pullAndApply();
  setInterval(()=>{if(!document.hidden){loadData();pullAndApply()}},4*60e3);
  document.addEventListener('visibilitychange',()=>{if(!document.hidden){loadData();pullAndApply()}});
  window.addEventListener('pageshow',e=>{if(e.persisted){loadData();liveRefresh();pullAndApply()}});
})();
})();
</script>
